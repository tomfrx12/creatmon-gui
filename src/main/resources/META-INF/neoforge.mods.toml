modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    description = "Custom shop GUI for Creatmon modpack"

[[dependencies.creatmon_gui]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.creatmon_gui]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
# XP du pass pour les machines Create (ignoré si Create est absent)
[[mixins]]
    config = "creatmon_gui.mixins.json"
